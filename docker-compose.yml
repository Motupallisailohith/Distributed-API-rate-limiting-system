version: '3.8'
services:
  node1:
    build: .
    container_name: rate-node1
    hostname: node1
    ports:
      - "8081:8080"
      - "7000:7000/udp"
    volumes:
      - ./config/nodes.yml:/app/config/nodes.yml
    command:
      - --udp.port=7000
      - --http.port=8080
      - --config=/app/config/nodes.yml

  node2:
    build: .
    container_name: rate-node2
    hostname: node2
    ports:
      - "8082:8080"
      - "7001:7001/udp"
    volumes:
      - ./config/nodes.yml:/app/config/nodes.yml
    command:
      - --udp.port=7001
      - --http.port=8082
      - --config=/app/config/nodes.yml
